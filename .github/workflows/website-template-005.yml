name: ATZ-WEB-005 website template build and QA
on:
  push:
    branches: ['lab/website-template-005']
permissions:
  contents: write
jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --only-shell chromium
      - run: |
          git clone --no-checkout https://github.com/atrezzostudiosv-spec/denton-fence.git /tmp/fence-source
          git -C /tmp/fence-source checkout 00852d226ef7b9e96c7b13a2ebd7bf1d4cbf8b45
      - run: node scripts/build-website-template-005.mjs /tmp/fence-source
      - run: npm test
      - run: node tests/website-template-005-browser.mjs /tmp/fence-source
      - run: |
          python3 - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path('websites/templates/ATZ-WEB-005/v1/')
          with zipfile.ZipFile(root/'ATZ-WEB-005-v1.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted((root/'site').rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root/'site'))
              for n in ['README.md','template-config.json']: z.write(root/n,n)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/websites.json websites/templates/ATZ-WEB-005/v1/
          git commit -m "Validate and package ATZ-WEB-005"
          git push origin HEAD:lab/website-template-005
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-template-005-evidence
          path: |
            websites/templates/ATZ-WEB-005/v1/qa.json
            websites/templates/ATZ-WEB-005/v1/motion-qa.json
            websites/templates/ATZ-WEB-005/v1/poster.webp
