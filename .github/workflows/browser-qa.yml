name: Browser QA for component library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies on runner
        run: npm install --no-save playwright@1.65.0 gsap@3.12.5
      - name: Install Chromium headless shell and OS dependencies
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run 11 variants at 4 widths and accessibility fallbacks
        run: node tests/browser-qa.mjs
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrezzo-browser-qa
          path: tests/artifacts/
          if-no-files-found: warn
