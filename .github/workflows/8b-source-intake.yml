name: Intake external 8B website sources
on:
  push:
    branches:
      - library/8b-website-collection
    paths:
      - '.github/workflows/8b-source-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 8b-external-source-intake
  cancel-in-progress: false
jobs:
  intake:
    if: github.ref == 'refs/heads/library/8b-website-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library/8b-website-collection
      - name: Verify and fetch original text source only
        run: |
          python3 -m py_compile website-library/8b/import_8b.py
          python3 website-library/8b/import_8b.py
      - name: Commit source inventory only to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website-library/8b/templates website-library/8b/manifest.json website-library/8b/INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m 'Import verified 8B MIT source collection and record exclusions'
          git push origin HEAD:refs/heads/library/8b-website-collection
