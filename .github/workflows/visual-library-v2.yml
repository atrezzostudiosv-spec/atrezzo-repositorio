name: Visual Library V2 — authentic media and QA
on:
  push:
    branches: [feat/visual-library-v2]
    paths:
      - 'catalog/visual*'
      - 'catalog/index.html'
      - 'catalog/technical.html'
      - 'catalog/preview.html'
      - 'catalog/brand/**'
      - 'tests/brand-contract.mjs'
      - 'registry/visual-discovery.json'
      - 'tests/visual-browser.mjs'
      - 'scripts/finish-transition-posters.mjs'
      - '.github/workflows/visual-library-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-library-v2-media
  cancel-in-progress: true
jobs:
  visual-library:
    if: github.ref == 'refs/heads/feat/visual-library-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm install --no-save playwright@1.65.0 gsap@3.12.5
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Check whether approved media already exist
        id: media
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("registry/components.json"));const m=JSON.parse(fs.readFileSync("catalog/previews/manifest.json"));const ok=r.entries.every(e=>m.entries?.[e.id]&&fs.existsSync("catalog/"+m.entries[e.id].poster)&&fs.existsSync("catalog/"+m.entries[e.id].video));fs.appendFileSync(process.env.GITHUB_OUTPUT,"complete="+ok+"\nrepair="+(ok&&m.editorialRepair!=="phase04-v1")+"\nposter="+(m.posterReview==="phase05-accepted")+"\n");'
      - name: Install FFmpeg encoder
        if: steps.media.outputs.complete != 'true' || steps.media.outputs.repair == 'true' || steps.media.outputs.poster != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
      - name: Capture genuine demos and test V2 at four widths
        if: steps.media.outputs.complete != 'true'
        run: node tests/visual-browser.mjs --capture
      - name: Repair six editorial previews and verify new visual-first workspace
        if: steps.media.outputs.repair == 'true'
        run: node tests/visual-browser.mjs --repair
      - name: Finish representative still images of approved transition videos
        if: steps.media.outputs.complete == 'true' && steps.media.outputs.repair != 'true' && steps.media.outputs.poster != 'true'
        run: node scripts/finish-transition-posters.mjs
      - name: Verify existing visual catalog and official brand at four widths
        if: steps.media.outputs.complete == 'true' && steps.media.outputs.repair != 'true'
        run: node tests/visual-browser.mjs
      - name: Upload captured assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-library-v2-media
          path: |
            catalog/previews/
            tests/artifacts/visual-v2/
      - name: Commit only generated assets to the review branch
        if: steps.media.outputs.complete != 'true' || steps.media.outputs.repair == 'true' || steps.media.outputs.poster != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/previews/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture authentic component posters and motion previews"
          git push origin HEAD:feat/visual-library-v2
