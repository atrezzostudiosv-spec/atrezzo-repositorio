name: Originales — Scroll Frame Sequence public QA
on:
  push:
    branches: ['lab/atz-sec-013']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save playwright gsap@3.15.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y -qq ffmpeg
      - run: node tests/scroll-frame-sequence-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-frame-sequence-public-qa
          path: qa-frame/
      - name: Register verified media and validation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const id='ATZ-SEC-013',run='https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8')),write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const r=read('registry/components.json'),e=r.source_approved_entries.find(e=>e.id===id);e.catalog_qa_status='passed_internal';e.catalog_qa_run=run;write('registry/components.json',r);
          const m=read(e.package_manifest);m.catalog_qa_status='passed_internal';m.catalog_qa_run=run;write(e.package_manifest,m);
          const i=read('registry/intake.json'),x=i.packages.find(p=>p.ids?.includes(id));x.status='ingested_internal_validated';x.validation_run=run;write('registry/intake.json',i);
          const p='catalog/previews/manifest.json',v=read(p);v.entries[id]={poster:'previews/'+id+'.webp',video:'previews/'+id+'.webm',source:e.preview,viewport:'1120x700',interaction:'371-frame reversible scroll',validation_run:run};write(p,v);
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/components.json registry/intake.json components/originales/trionn/ATZ-SEC-013/manifest.json catalog/previews/
          git commit -m "QA verified: Scroll Frame Sequence and authentic visual previews"
          git push origin HEAD:lab/atz-sec-013
