name: Website Library source smoke QA
on:
  push:
    branches: [library/8b-website-collection]
    paths:
      - 'website-library/8b/selection.json'
      - 'website-library/8b/source-qa.mjs'
      - '.github/workflows/8b-website-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-qa:
    if: github.ref == 'refs/heads/library/8b-website-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.65.0
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node website-library/8b/source-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8b-source-smoke-qa
          path: website-library-qa/
